apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: node-app
      tier: backend
  template:
    metadata: 
      labels:
        app: node-app
        tier: backend
    spec: 
      containers:
        - name: node-app
          image: owalrohit03/node-app:2
          imagePullPolicy: Always
